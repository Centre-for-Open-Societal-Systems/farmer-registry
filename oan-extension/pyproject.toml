[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oan-farmer-registry-extension"
description = "OpenAgriNet layer on the OpenG2P Farmer Registry extension"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
# openg2p-registry-farmer-extension is provided by the base image this package
# is installed into; it is not on PyPI, so it is not declared here.
dependencies = []
dynamic = ["version"]

[tool.hatch.version]
path = "src/oan_farmer_registry_extension/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oan_farmer_registry_extension"]
