[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-registry-farmer-extension"
description = "OpenG2P Registry Farmer Extension with the OpenAgriNet layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
dependencies = [
  "openg2p-fastapi-common >=1.1.2",
  "openg2p-g2pconnect-common-lib >=1.1.0",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Centre-for-Open-Societal-Systems/farmer-registry"

[tool.hatch.version]
path = "src/openg2p_registry_farmer_extension/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/openg2p_registry_farmer_extension"]
