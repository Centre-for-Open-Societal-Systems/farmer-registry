name: Build registry images
on:
  pull_request:
  push:
    branches: [develop, 'deploy/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: staff-api, dockerfile: docker/oan/staff-api.Dockerfile}
          - {component: partner-api, dockerfile: docker/oan/partner-api.Dockerfile}
          - {component: celery, dockerfile: docker/oan/celery.Dockerfile}
          - {component: db-seed, dockerfile: docker/oan/db-seed.Dockerfile}
          - {component: staff-ui, dockerfile: docker/oan/staff-ui.Dockerfile}
          - {component: sanity-tests, dockerfile: docker/sanity-tests/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: registry/${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Installed OAN extension regression checks
        if: matrix.component == 'staff-api'
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo/oan-extension -e PYTHONPATH=/repo/oan-extension/tests --entrypoint sh registry/staff-api:ci -c 'pip install --quiet pytest==8.4.2 && python -m pytest -q -p no:cacheprovider tests'
      - name: Native DDL, metadata replay and reporting preservation
        if: matrix.component == 'staff-api'
        env:
          OAN_METADATA_TEST_IMAGE: registry/staff-api:ci
        run: python3 ci/validation/check_native_metadata.py
      - name: Registered native worker services
        if: matrix.component == 'celery'
        run: |
          docker run --rm --network none --entrypoint python registry/celery:ci -c 'import openg2p_registry_celery_worker.main; from openg2p_registry_core.services.intake_form_data_service import G2PIntakeFormDataService; from openg2p_registry_oan_extension.register_domain.services.household_intake import OANIntakeFormDataService; assert isinstance(G2PIntakeFormDataService.get_component(), OANIntakeFormDataService)'
