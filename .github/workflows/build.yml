name: Build registry images
on:
  pull_request:
  push:
    branches: [develop, 'deploy/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: staff-api, dockerfile: docker/staff-api/Dockerfile}
          - {component: partner-api, dockerfile: docker/partner-api/Dockerfile}
          - {component: celery, dockerfile: docker/celery/Dockerfile}
          - {component: db-seed, dockerfile: docker/db-seed/Dockerfile}
          - {component: staff-ui, dockerfile: docker/staff-ui/Dockerfile}
          - {component: sanity-tests, dockerfile: docker/sanity-tests/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: registry/${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Platform entry points load the Farmer extension
        if: contains(fromJSON('["staff-api", "partner-api", "celery"]'), matrix.component)
        run: |
          roles=${{ matrix.component }}
          [ "$roles" = celery ] && roles="celery-worker celery-beat"
          for role in $roles; do
            docker run --rm --network none -v "$PWD:/repo:ro" --entrypoint python registry/${{ matrix.component }}:ci /repo/ci/validation/check_image_boot.py "$role"
          done
      - name: Installed Farmer extension regression checks
        if: matrix.component == 'staff-api'
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo/farmer-extension -e PYTHONPATH=/repo/farmer-extension/tests --entrypoint sh registry/staff-api:ci -c 'pip install --quiet pytest==8.4.2 && python -m pytest -q -p no:cacheprovider tests'
      - name: Native DDL, metadata replay and reporting preservation
        if: matrix.component == 'staff-api'
        env:
          OAN_METADATA_TEST_IMAGE: registry/staff-api:ci
        run: python3 ci/validation/check_native_metadata.py
      - name: Registered native worker services
        if: matrix.component == 'celery'
        run: |
          for mode in worker beat; do
            docker run --rm --network none -v "$PWD:/repo:ro" --entrypoint python registry/celery:ci /repo/ci/validation/check_worker_extensions.py "$mode"
          done
      - name: Native worker ODK save and rollback in owned PostgreSQL
        if: matrix.component == 'celery'
        env:
          OAN_WORKER_SAVE_TEST_IMAGE: registry/celery:ci
        run: python3 ci/validation/check_native_worker_save.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.component == 'celery'
        with:
          name: native-worker-save
          path: ci-output/native-worker-save/
