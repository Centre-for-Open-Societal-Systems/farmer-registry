name: Checks

# Fast, Docker-free checks that gate a change before the build:
#   * the openg2p-registry pin must stay in lockstep across the Dockerfiles and
#     the Helm chart dependency (test/test_rp_pin_lockstep.py);
#   * the platform overlay patches must still apply to the pinned sources and
#     behave as documented (test/test_patch_platform_iam_permissions.py);
#   * every location in the Ethiopia geo seed hangs off a parent, so the
#     Location cascade can reach it (test/test_geo_seed_hierarchy.py);
#   * ODK submissions still become draft intakes: the platform patches the
#     ingestion path needs (test/test_patch_platform_ingestion.py) and the
#     ODK transform's mapping (odk/test_transform.py).
# Runs in parallel with build-publish.yml; a split pin or a patch that no longer
# matches shows red in seconds instead of surfacing as a broken image later.

on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest
      - name: openg2p-registry pin lockstep
        run: python -m pytest test/test_rp_pin_lockstep.py -q
      - name: db-seed image ships every /seed file the chart's jobs run
        run: python -m pytest test/test_seed_files_shipped.py -q
      - name: platform overlay patches still apply
        run: python -m pytest test/test_patch_platform_iam_permissions.py -q
      - name: location seed is one connected tree
        run: python -m pytest test/test_geo_seed_hierarchy.py -q
      - name: platform patches for partner ingestion still apply
        run: python -m pytest test/test_patch_platform_ingestion.py -q
      - name: ODK transform renders an OData-shaped submission
        run: pip install --quiet jinja2 && python odk/test_transform.py
      - name: committed ODK form matches the pipeline and the transform
        run: pip install --quiet openpyxl && python -m pytest test/test_odk_forms.py test/test_odk_location_media.py -q

  gen2-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4
        with:
          version: 'v3.19.0'
      - run: pip install --quiet pytest -r ci/gen2/requirements.txt
      - name: resolve the published registry dependency
        run: |
          helm repo add openg2p https://openg2p.github.io/openg2p-helm
          helm dependency update helm/openg2p-farmer-registry
      - name: lint the Gen2 development profile
        run: helm lint helm/openg2p-farmer-registry -f helm/openg2p-farmer-registry/environments/dev-commons.yaml --strict
      - name: resolve the deployed Commons artifact pair for contract checks
        run: |
          BASE_VERSION=$(python -c "import yaml; print(yaml.safe_load(open('helm/openg2p-farmer-registry/environments/dev-commons.yaml'))['sharedCommons']['baseChartVersion'])")
          SERVICES_VERSION=$(python -c "import yaml; print(yaml.safe_load(open('helm/openg2p-farmer-registry/environments/dev-commons.yaml'))['sharedCommons']['servicesChartVersion'])")
          mkdir -p .cache/gen2-charts
          helm pull openg2p/openg2p-commons-base --version "$BASE_VERSION" --destination .cache/gen2-charts
          helm pull openg2p/openg2p-commons-services --version "$SERVICES_VERSION" --destination .cache/gen2-charts
      - name: render and assert shared-service and browser contracts
        run: python -m pytest test/test_gen2_common_helm.py -q
      - name: validate independent local Commons and Farmer projects
        run: |
          python local/gen2/stack.py validate
          python -m unittest discover -s test -p test_gen2_local.py -v
