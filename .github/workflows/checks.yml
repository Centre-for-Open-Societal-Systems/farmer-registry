name: Checks

# Validate the RC pins, effective COSS metadata, ODK mapping and chart.

on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require develop as the staging promotion source
        if: github.event_name == 'pull_request' && github.base_ref == 'staging'
        env:
          PROMOTION_SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$PROMOTION_SOURCE_BRANCH" != develop ]; then
            echo 'Staging changes must arrive through a develop-to-staging pull request.' >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest jinja2 openpyxl PyYAML==6.0.2
      - name: openg2p-registry pin lockstep
        run: python -m pytest tests/unit/test_rp_pin_lockstep.py -q
      - name: Effective COSS metadata
        run: python -m pytest tests/unit/extension/test_metadata_effective_layer.py -q
      - name: Commons PM deployment guard
        run: python -m pytest tests/unit/test_pm_manifest.py -q
      - name: Jenkins deployment migration guard
        run: |
          python -m pytest tests/unit/test_jenkins_deployment.py tests/unit/test_service_coordination.py -q
          bash -n ci/deploy/deploy-dev.sh
      - name: Jenkins Python container
        run: |
          docker build -t coss-ci/validation:check ci/validation
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" coss-ci/validation:check bash ci/validation/validate.sh
      - name: Deployment shell compatibility (Bash 4.3)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo bash:4.3 bash tests/integration/test-deploy-shell.sh
          docker run --rm -v "$PWD:/repo:ro" -w /repo bash:4.3 bash tests/integration/test-staging-deploy-shell.sh
          docker run --rm -v "$PWD:/repo:ro" -w /repo bash:4.3 bash tests/integration/test-container-shell.sh
      - name: Optional services tooling container
        run: |
          docker build -t coss-ci/services:check ci/services
          docker run --rm coss-ci/services:check bash -ec 'python -c "import yaml"; git --version; helm version --short; aws --version; docker --version; docker buildx version'
          docker run --rm --user 1000:1000 coss-ci/services:check bash -ec 'getent passwd "$(id -u)" >/dev/null; ssh -V'
      - name: ODK transform
        run: python tests/unit/test_odk_transform.py
      - name: ODK geography matches the shared COSS seed
        run: python -m pytest tests/unit/test_odk_location_media.py tests/unit/test_odk_geo_compatibility.py tests/unit/test_shared_geo_migration.py tests/unit/test_odk_map_policy.py -q
      - name: Master Data credential and location repair guards
        run: python -m pytest tests/unit/test_location_projections.py tests/unit/test_master_data_credentials.py -q
      - name: Independent Commons and Registry projects
        run: python local/upstream/stack.py validate
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Resolve and validate the RC chart
        run: |
          helm repo add openg2p https://openg2p.github.io/openg2p-helm
          helm dependency build helm/openg2p-farmer-registry
          helm lint helm/openg2p-farmer-registry --strict
          helm template farmer-registry helm/openg2p-farmer-registry -n farmer > /tmp/farmer.yaml
          python -m pytest tests/unit/test_connector_credentials.py -q
