name: Checks
on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ci/validation/requirements.txt ruff==0.17.2
      - name: Source syntax and inherited delivery boundaries
        run: |
          python -m ruff check --select E9,F63,F7,F82 oan-extension/src oan-extension/tests
          bash ci/validation/validate.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real ODK signature client against PM contract simulation
        env:
          PYTHONPATH: oan-extension/src
          OAN_ODK_PM_SIMULATION_URL: http://127.0.0.1:49216/pm
          OAN_REPORTING_MDS_SIMULATION_URL: http://127.0.0.1:49216/mds
        run: |
          npm install --global postman-cli@1.73.0
          postman simulation run postman/simulations/odk-identity.sim.yaml --port 49216 --output ndjson > "$RUNNER_TEMP/odk-simulation.ndjson" 2> "$RUNNER_TEMP/odk-simulation.err" &
          simulation_pid=$!
          trap 'kill "$simulation_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:49216/pm/health >/dev/null; then break; fi
            sleep 1
          done
          python -m pytest -q -p no:cacheprovider oan-extension/tests/test_odk_signature_http.py tests/unit/test_reporting_geography.py

  popup-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble the immutable upstream UI with registered OAN widgets
        run: npm install --prefix ui/staff-ui --no-audit --no-fund
      - name: Install isolated browser test tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Production popup widget and native data-path regression
        run: |
          mkdir -p ci-output/popup
          python ui/staff-ui/test/popup-flow/run_browser.py --node-modules ui/staff-ui/.app/node_modules --chromium --output ci-output/popup/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popup-browser
          path: ci-output/popup/
