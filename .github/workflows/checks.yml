name: Checks

# Validate the RC pins, effective COSS metadata, ODK mapping and chart.

on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pytest jinja2 openpyxl PyYAML==6.0.2
      - name: openg2p-registry pin lockstep
        run: python -m pytest test/test_rp_pin_lockstep.py -q
      - name: Effective COSS metadata
        run: python -m pytest farmer-extension/tests/test_metadata_effective_layer.py -q
      - name: Commons PM deployment guard
        run: python -m pytest test/test_pm_manifest.py -q
      - name: Jenkins deployment migration guard
        run: |
          python -m pytest test/test_jenkins_deployment.py -q
          bash -n ci/jenkins/deploy-dev.sh
      - name: Jenkins Python container
        run: |
          docker build -t coss-ci/validation:check ci/jenkins
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" coss-ci/validation:check bash ci/jenkins/validate.sh
      - name: Deployment shell compatibility (Bash 4.3)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo bash:4.3 bash ci/jenkins/test-deploy-shell.sh
      - name: ODK transform
        run: python odk/test_transform.py
      - name: ODK geography matches the shared COSS seed
        run: python -m pytest test/test_odk_location_media.py test/test_odk_geo_compatibility.py test/test_shared_geo_migration.py -q
      - name: Independent Commons and Registry projects
        run: python local/upstream/stack.py validate
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Resolve and validate the RC chart
        run: |
          helm repo add openg2p https://openg2p.github.io/openg2p-helm
          helm dependency build helm/openg2p-farmer-registry
          helm lint helm/openg2p-farmer-registry --strict
          helm template farmer-registry helm/openg2p-farmer-registry -n farmer > /tmp/farmer.yaml
