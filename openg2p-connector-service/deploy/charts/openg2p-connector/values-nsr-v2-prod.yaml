# UD production — namespace nsr-v2, release connector
# Install:
#   helm dependency update deploy/charts/openg2p-connector
#   helm upgrade --install connector deploy/charts/openg2p-connector \
#     -n nsr-v2 -f deploy/charts/openg2p-connector/values-nsr-v2-prod.yaml

fullnameOverride: connector

global:
  hostname: connector.nsr.mowsa.gov.et
  postgresqlHost: commons-postgresql
  postgresqlPort: 5432
  redisHost: commons-redis-master
  redisPort: 6379
  partnerApiService: registry-partner-api
  connectorDB: nsr_connector
  connectorDBUser: nsr_connector_user
  connectorDBSecret: nsr-connector
  connectorDBUserPasswordKey: nsr-connector-db-user

commonEnv:
  CONNECTOR_DB_DRIVER: postgresql+asyncpg
  CONNECTOR_LOG_LEVEL: INFO
  CONNECTOR_STORE_RUN_PAYLOADS: "true"
  CONNECTOR_STRICT_INCREMENTAL: "true"
  CONNECTOR_FULL_SCAN_ON_INCREMENTAL_UNSUPPORTED: "false"
  CONNECTOR_METRICS_ENABLED: "true"
  CONNECTOR_CORS_ORIGINS: https://connector.nsr.mowsa.gov.et

api:
  image:
    repository: asierneb/openg2p-connector-service
    tag: nsr-slashfix-202605221435
    pullPolicy: Always

worker:
  image:
    repository: asierneb/openg2p-connector-service
    tag: nsr-slashfix-202605221435
    pullPolicy: Always

beat:
  image:
    repository: asierneb/openg2p-connector-service
    tag: nsr-slashfix-202605221435
    pullPolicy: Always

ui:
  image:
    repository: asierneb/openg2p-connector-ui
    tag: nsr
    pullPolicy: Always

istio:
  enabled: true
  gateway:
    create: false
    name: internal
  virtualservice:
    enabled: true
    gateway: internal

postgres-init:
  enabled: true
