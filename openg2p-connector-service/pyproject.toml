[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-connector-service"
authors = [
  { name="OpenG2P", email="info@openg2p.org" },
]
description = "OpenG2P Integration Connector Service — multi-transport ingestion gateway"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.109",
  "uvicorn[standard]",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "httpx>=0.27",
  "celery>=5.3",
  "redis>=5.0",
  "jmespath>=1.0",
  "aiokafka>=0.9",
  "aio-pika>=9.0",
  "aiobotocore>=2.5",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-fastapi",
  "prometheus-client>=0.19",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "aiosqlite"]

[project.urls]
Homepage = "https://openg2p.org"
Documentation = "https://docs.openg2p.org/"
Repository = "https://github.com/OpenG2P/openg2p-connector-service"
Source = "https://github.com/OpenG2P/openg2p-connector-service"

[project.scripts]
connector-consumer = "openg2p_connector_service.consumer_supervisor:main"

[tool.hatch.version]
path = "src/openg2p_connector_service/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "strict"
