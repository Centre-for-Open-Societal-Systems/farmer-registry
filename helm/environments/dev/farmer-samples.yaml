# Sample data on the dev environment is off. The pack's 21 sample people are already
# registered on New Dev, and the OAN loader (docker/db-seed/load_sample_data.py)
# changed Keycloak on every upgrade where the approvers' password login was refused:
# it re-enabled direct access grants on the release staff client and reset the
# sample approvers' passwords. Sample data comes only from openg2p-data, and every
# register change goes through an approval task, so the loader stays off until the
# db-seed cleanup removes it. Merged over saved release values by
# ci/deploy/deployment.py for dev only; staging never loads samples.
registry:
  dbSeed:
    loadSampleData: false
