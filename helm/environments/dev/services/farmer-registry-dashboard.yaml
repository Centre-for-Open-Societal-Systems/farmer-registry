# Shared development staff IAM and wildcard Gateway. Secret contents stay outside Git.
_coordination:
  namespace: farmer
environment: ''
iam:
  url: https://staff-iam.development.oanstaging.com
  cookieDomain: .development.oanstaging.com
links:
  staffPortalUrl: https://staff-portal.development.oanstaging.com
  registryPortalUrl: https://farmer-registry.development.oanstaging.com
dashboardApi:
  service: farmer-registry-dashboard-api
  auth:
    enabled: true
iamSetup:
  grantUsers: [admin]
  description: Farmer Dashboard
host: farmer-registry-dashboard.development.oanstaging.com
ingress:
  public:
    existingGateway: istio-system/development
