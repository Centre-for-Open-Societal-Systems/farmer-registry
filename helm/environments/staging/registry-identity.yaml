# Merge over the protected installed values. Storage, routes, callback URLs and
# Secret references come from that release, not a copy of development values.
global:
  keycloakBaseUrl: https://keycloak.oanstaging.com
  keycloakRealm: staff
  keycloakIssuerUrl: https://keycloak.oanstaging.com/realms/staff
registry:
  # Retain setup Jobs for the entire Helm wait, including image pulls. A 100s
  # TTL removed completed Jobs while Helm was still waiting during cutover.
  postgres-init:
    job:
      ttlSecondsAfterFinished: 3600
  keycloak-init:
    job:
      ttlSecondsAfterFinished: 3600
  idgenerator:
    postgres-init:
      job:
        ttlSecondsAfterFinished: 3600
    idGenerator:
      image:
        repository: openg2p/openg2p-id-generator
        tag: 1.1.2@sha256:72e0b84b14b54aefc399104ad10139ea8b7ac1592cdde47ba15589a4c478945e
  staffApi:
    envVars:
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_CLIENT_ID: farmer-registry-staff-portal
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_TOKEN_URL: https://keycloak.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_STAFF_PORTAL_API_PARTNER_MGMT_ADMIN_TOKEN_URL: https://keycloak.oanstaging.com/realms/staff/protocol/openid-connect/token
    envVarsFrom:
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_CLIENT_SECRET:
        secretKeyRef:
          name: farmer-registry-staff-portal
          key: client_secret
          optional: false
  partnerApi:
    envVars:
      REGISTRY_PARTNER_API_MASTER_DATA_CLIENT_ID: farmer-registry-staff-portal
      REGISTRY_PARTNER_API_SIGNATURE_VALIDATION_ENABLED: 'true'
      REGISTRY_PARTNER_API_MASTER_DATA_TOKEN_URL: https://keycloak.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_PARTNER_API_KEYMANAGER_AUTH_URL: https://keycloak.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_PARTNER_API_PARTNER_MGMT_ADMIN_TOKEN_URL: https://keycloak.oanstaging.com/realms/staff/protocol/openid-connect/token
    envVarsFrom:
      REGISTRY_PARTNER_API_MASTER_DATA_CLIENT_SECRET:
        secretKeyRef:
          name: farmer-registry-staff-portal
          key: client_secret
          optional: false
  celeryWorker:
    envVars:
      REGISTRY_CELERY_WORKERS_MASTER_DATA_CLIENT_ID: farmer-registry-staff-portal
      REGISTRY_CELERY_WORKERS_AWE_TOKEN_ISSUER_BASE_URL: https://keycloak.oanstaging.com
      REGISTRY_CELERY_WORKERS_AWE_TOKEN_URL: https://keycloak.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_CELERY_WORKERS_MASTER_DATA_TOKEN_URL: https://keycloak.oanstaging.com/realms/staff/protocol/openid-connect/token
      REGISTRY_CELERY_WORKERS_PARTNER_MGMT_ADMIN_TOKEN_URL: https://keycloak.oanstaging.com/realms/staff/protocol/openid-connect/token
    envVarsFrom:
      REGISTRY_CELERY_WORKERS_MASTER_DATA_CLIENT_SECRET:
        secretKeyRef:
          name: farmer-registry-staff-portal
          key: client_secret
          optional: false
