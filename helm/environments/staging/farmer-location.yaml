# Staging counterpart of ../dev/farmer-location.yaml. Farmer runs in namespace farmer; Master Data is in commons. Location reads use reviewed routes and service bindings.
# Merge over saved release values. Keep existing client IDs and Secret refs.
global:
  masterDataApiUrl: http://commons-services-master-data-api.commons.svc.cluster.local
  masterDataTokenUrl: https://keycloak.qa.oanstaging.com/realms/staff/protocol/openid-connect/token
registry:
  staffUi:
    envVars:
      MASTERDATA_BACKEND_API_URL: http://commons-services-master-data-api.commons.svc.cluster.local
      # The farmer location map's elevation lookup (connect). CSP_SRC_IMG (object-store host and OpenStreetMap
      # tiles) is not repeated here: it comes from oan-helm's environments/staging/values/farmer.yaml, so the
      # object-store host is set in one place.
      CSP_SRC_CONNECT: 'self https://api.open-meteo.com'
  staffApi:
    envVars:
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_API_URL: http://commons-services-master-data-api.commons.svc.cluster.local
      REGISTRY_STAFF_PORTAL_API_MASTER_DATA_TOKEN_URL: https://keycloak.qa.oanstaging.com/realms/staff/protocol/openid-connect/token
  partnerApi:
    envVars:
      REGISTRY_PARTNER_API_MASTER_DATA_API_URL: http://commons-services-master-data-api.commons.svc.cluster.local
      REGISTRY_PARTNER_API_MASTER_DATA_TOKEN_URL: https://keycloak.qa.oanstaging.com/realms/staff/protocol/openid-connect/token
  celeryWorker:
    envVars:
      REGISTRY_CELERY_WORKERS_MASTER_DATA_API_URL: http://commons-services-master-data-api.commons.svc.cluster.local
      REGISTRY_CELERY_WORKERS_MASTER_DATA_TOKEN_URL: https://keycloak.qa.oanstaging.com/realms/staff/protocol/openid-connect/token
