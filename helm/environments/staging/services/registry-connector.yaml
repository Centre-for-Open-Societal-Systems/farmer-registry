# Paused preparation only; no ODK credentials or private keys belong here.
# The trusted staging-farmer-dev-acceptance file supplies the final stopped
# backup hash and rehearsed staging chart hash. Images retain their dev digests.
_coordination:
  namespace: far
  database: farmer_connector_v2_far
  databaseEnv: CONNECTOR_DB_DBNAME
  oldDatabaseEnv: CONNECTOR_DB_DBNAME
  queue: farmer-registry-connector-v2-far
fullnameOverride: farmer-registry-connector
cossQueue: farmer-registry-connector-v2-far
cossSigning:
  enabled: true
  partnerId: farmer-partner
  keyId: farmer-connector-v2-far
  secret: farmer-connector-v2-far-signing
global:
  hostname: connector-farmer-registry.far.staging.openg2p.test
  postgresqlHost: commons-postgresql.commons.svc.cluster.local
  postgresqlPort: 5432
  connectorDB: farmer_connector_v2_far
  connectorDBUser: far_farmer_connector_v2_user
  connectorDBSecret: farmer-connector-v2-far-db
  connectorDBUserPasswordKey: password
  redisHost: farmer-registry-redis-master
  redisPort: 6379
  partnerApiService: farmer-registry-partner-api
imagePullSecrets:
  - name: ecr-pull-secret
commonEnv:
  CONNECTOR_STORE_RUN_PAYLOADS: 'false'
  CONNECTOR_STRICT_INCREMENTAL: 'true'
  CONNECTOR_FULL_SCAN_ON_INCREMENTAL_UNSUPPORTED: 'false'
  CONNECTOR_CORS_ORIGINS: https://connector-farmer-registry.far.staging.openg2p.test
api:
  replicaCount: 0
  autoscaling:
    enabled: false
worker:
  replicaCount: 0
beat:
  enabled: false
consumer:
  enabled: false
ui:
  replicaCount: 0
postgresCheckerInit:
  enabled: false
postgres-init:
  enabled: false
istio:
  enabled: false
  virtualservice:
    enabled: false
