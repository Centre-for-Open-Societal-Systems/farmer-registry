# The release's own ECR pull secret (chart templates/ecr-pull-secret.yaml): a pre-install/pre-upgrade hook
# writes farmer-registry-ecr-pull-secret from the node's IAM role and a CronJob refreshes it every 6 hours
# (ECR tokens last 12 h); both patch the default ServiceAccount, which the registry pods and seed jobs use.
# Replaces the hand-made namespace refresher. Merged over saved release values by ci/deploy/deployment.py.
ecrPullSecret:
  enabled: true
  registry: 379220350808.dkr.ecr.ap-south-1.amazonaws.com
  serviceAccounts:
    - default
