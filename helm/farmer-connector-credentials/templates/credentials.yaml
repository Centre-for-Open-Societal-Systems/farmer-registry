{{- if ne .Release.Namespace "farmer" }}
{{- fail "Connector credentials belong only in the farmer namespace" }}
{{- end }}
{{- if ne .Release.Name "farmer-connector-credentials" }}
{{- fail "Use the Farmer connector credentials release name" }}
{{- end }}
{{- range $kind, $name := dict "database" .Values.databaseSecret "signing" .Values.signingSecret }}
{{- $expected := ternary "farmer-connector-v2-db" "farmer-connector-v2-signing" (eq $kind "database") }}
{{- if ne $name $expected }}{{ fail "Unexpected connector Secret name" }}{{ end }}
{{- $key := ternary "password" "private-key.pem" (eq $kind "database") }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- $value := "" }}
{{- if $existing }}
  {{- if ne (index ($existing.metadata.annotations | default dict) "meta.helm.sh/release-name") $.Release.Name }}
    {{- fail "Refusing to adopt an existing connector Secret owned by another release" }}
  {{- end }}
  {{- $value = index ($existing.data | default dict) $key | default "" }}
  {{- if not $value }}{{ fail "Existing connector credential is incomplete; refusing rotation" }}{{ end }}
{{- else if eq $kind "database" }}
  {{- $value = randAlphaNum 48 | b64enc }}
{{- else }}
  {{- $value = genPrivateKey "rsa" | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: farmer-connector-credentials
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: Opaque
data:
  {{ $key }}: {{ $value | quote }}
{{- end }}
