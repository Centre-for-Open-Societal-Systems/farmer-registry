{{- /*
ECR pull secret for the dashboard image, kept by the release itself so the
namespace needs no manual setup. ECR tokens expire after 12 hours:
  - a pre-install/pre-upgrade hook Job writes the secret before the pod is
    created or rolled, so the first deploy can pull;
  - a CronJob refreshes it every 8 hours.
Both fetch the token with the node's IAM role and write only the one secret
named in ecrPullSecret.name.
*/ -}}
{{- if .Values.ecrPullSecret.enabled }}
{{- $name := include "dashboard.ecrRefresher" . }}
{{- $hook := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation" }}
{{- range $i, $mode := list "hook" "release" }}
{{- $isHook := eq $mode "hook" }}
{{- $objName := ternary (printf "%s-init" $name) $name $isHook }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $objName }}
  labels:
    {{- include "dashboard.labels" $ | nindent 4 }}
  {{- if $isHook }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hook) | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $objName }}
  labels:
    {{- include "dashboard.labels" $ | nindent 4 }}
  {{- if $isHook }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10") $hook) | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $.Values.ecrPullSecret.name | quote }}]
    verbs: ["get", "update", "patch"]
  # create cannot be limited by resourceNames; needed the first time only.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $objName }}
  labels:
    {{- include "dashboard.labels" $ | nindent 4 }}
  {{- if $isHook }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-9") $hook) | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ $objName }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $objName }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-init
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-5") $hook) | nindent 4 }}
spec:
  {{- include "dashboard.ecrJobSpec" (dict "root" . "serviceAccount" (printf "%s-init" $name)) | nindent 2 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.ecrPullSecret.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      {{- include "dashboard.ecrJobSpec" (dict "root" . "serviceAccount" $name) | nindent 6 }}
{{- end }}
