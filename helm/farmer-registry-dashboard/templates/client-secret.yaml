{{- /*
Client secret of the dashboard's Keycloak client (access.clientId). Generated
once and kept across upgrades (lookup) and uninstalls (resource-policy keep),
so the Keycloak client and this Secret stay in step. Skipped when
iamSetup.clientSecret.name points at a Secret managed elsewhere.
*/ -}}
{{- if not .Values.iamSetup.clientSecret.name }}
{{- $name := include "dashboard.clientSecretName" . }}
{{- $key := .Values.iamSetup.clientSecret.key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
