{{- if .Values.smoke.enabled }}
{{- if not .Values.dashboardApi.auth.enabled }}
{{- fail "deployed dashboards require dashboardApi.auth.enabled=true" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dashboard.fullname" . }}-chart-smoke
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "dashboard.imagePullSecrets" . | nindent 6 }}
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: verify-charts
          image: {{ include "dashboard.image" . }}
          command: [node, iam/smoke.mjs]
          env:
            {{- include "dashboard.appEnv" . | nindent 12 }}
            - name: DASHBOARD_API_URL
              value: {{ include "dashboard.dashboardApiUrl" . | quote }}
            - name: OIDC_TOKEN_URL
              value: {{ .Values.dashboardApi.auth.tokenUrl | quote }}
            - name: DASHBOARD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dashboard.clientSecretName" . }}
                  key: {{ .Values.iamSetup.clientSecret.key }}
            - name: DASHBOARD_SMOKE_CHARTS
              value: {{ required "smoke.charts must not be empty" (join "," .Values.smoke.charts) | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 192Mi}
{{- end }}
