# Farmer Registry — values overlay for the openg2p-registry chart.
#
# This chart owns only the analytics jobs (templates/); everything else comes from
# the openg2p-registry subchart (pinned in Chart.yaml, aliased `registry`) with the
# overrides below. Install:
#
#     helm repo add openg2p https://openg2p.github.io/openg2p-helm
#     helm dependency build ./helm/openg2p-farmer-registry
#     helm install farmer-registry ./helm/openg2p-farmer-registry
#
# Two kinds of override:
#   * global.*    — Helm propagates these to the subchart (and its subcharts).
#   * registry.*  — values for the openg2p-registry subchart itself.
# Everything not set here (all service wiring, keycloak/iam, db-seed machinery,
# id-generator, demo users) is inherited from the subchart defaults.

# ── Globals (propagate to the openg2p-registry subchart) ──────────────────────
global:
  registryVariant: 'farmer-registry'
  # Ingress host for this registry. Overrides the subchart's generic default.
  registryHostname: '{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'

  # Where AWE posts its approval decision back to the registry. The subchart
  # default routes this through the public ingress
  # (https://staff-<registryHostname>/awe/webhooks/decision), which means a
  # call between two Services in the same namespace leaves the cluster, comes
  # back in through the ingress, and depends on that ingress certificate being
  # trusted by AWE. On the far namespace the ingress is signed by a private CA
  # that AWE does not carry, and its webhook client has no verify/CA setting,
  # so every delivery since the integration went live failed with
  # CERTIFICATE_VERIFY_FAILED: AWE recorded the request as approved, the
  # registry never heard, and the submission sat in PENDING with the ingest
  # worker correctly never picking it up.
  #
  # Call the staff-portal-api Service directly instead, as docker-compose.yml
  # does. The payload is HMAC-signed (X-Approval-Signature, secret from
  # awe-callback-hmac-secret), so dropping TLS on the in-cluster hop does not
  # weaken authentication. The Service is named by the subchart's
  # staffApi.nameOverride ("staff-portal-api") on port 80.
  #
  # db-seed writes the same value into AWE's callback_secret.caller_service
  # and repoints this registry's still-open requests and their undelivered
  # webhooks to it (awe_meta_data/40_callback_secret.sql.tpl), so the seed
  # must run with the deploy (it does: dbSeed is enabled) for AWE to pick the
  # new address up.
  aweDefaultCallbackUrl: 'http://{{ .Release.Name }}-staff-portal-api/awe/webhooks/decision'

  # Browser-facing MinIO host. Record images (the farmer photo captured at
  # intake, land certificates) are served to the BROWSER as pre-signed URLs
  # built against this value, and the subchart also derives the staff-ui
  # img-src CSP from it (CSP_SRC_IMG). It must therefore be a hostname a
  # browser can actually resolve and reach.
  #
  # Point it at an in-cluster Service name and the photo silently fails twice
  # over: the browser cannot resolve the name, and the CSP it generates blocks
  # the request anyway, so the widget just shows its placeholder with no error
  # that names the cause.
  #
  # Note this host is also what the API SIGNS against, and a pre-signed S3
  # signature covers the Host header -- so the signer and the browser must use
  # the SAME name. Fixing only the CSP is not enough, and neither is rewriting
  # the host at an ingress: the replayed signature is rejected with
  # SignatureDoesNotMatch. Both halves of that are demonstrated against a real
  # MinIO in test/staff-ui/test_minio_presigned_host.py. Set minioSecure to
  # match the scheme (https -> true).
  #
  # Inherited from the subchart default unless overridden per environment.
  # minioHost: 'minio-api.{{ .Release.Namespace }}.openg2p.org'
  # minioSecure: true

  # Database wiring, mirroring openg2p-registry's own defaults. Declared here
  # rather than inherited because a parent chart's templates cannot read a
  # subchart's globals — only the other direction — and the analytics Jobs in
  # templates/ need them. The values are deliberately IDENTICAL to the subchart's,
  # so declaring them changes nothing about how the subchart resolves; drifting
  # them would point the analytics jobs at a different database than the services.
  postgresqlHost: commons-postgresql
  registryDB:  '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'
  masterDataDB: 'master_data'
  masterDataDBPort: 5432
  masterDataDBUser: 'master_data_user'
  masterDataDBSecret: 'master-data'
  masterDataDBUserPasswordKey: 'master-data-db-user'

# ── openg2p-registry subchart overrides ───────────────────────────────────────
registry:
  # Farmer-built images (each FROM the matching openg2p-registry base image).
  # CI rewrites these tags to the freshly built farmer version (lockstep); the
  # base image they extend is pinned by the openg2p-registry dependency version.
  staffApi:
    image:
      repository: registry.gitlab.com/openg2p/registry/farmer-registry/staff-api
      tag: 0.0.0-develop
  staffUi:
    image:
      repository: registry.gitlab.com/openg2p/registry/farmer-registry/staff-ui
      tag: 0.0.0-develop
  partnerApi:
    image:
      repository: registry.gitlab.com/openg2p/registry/farmer-registry/partner-api
      tag: 0.0.0-develop
  celeryWorker:
    image:
      repository: registry.gitlab.com/openg2p/registry/farmer-registry/celery
      tag: 0.0.0-develop
    # Ingested (partner / ODK) submissions start their AWE approval workflow
    # here, like a staff Submit does in the staff-portal-api: same AWE, same
    # callback, so decisions come back to the staff-portal-api as usual. The
    # subchart gives the worker no AWE settings, and the worker has no user, so
    # it logs in with a client-credentials token of the release's client (the
    # one the partner-api's keymanager auth already uses). That client needs
    # "Service accounts" enabled; without a token, ingests fail with
    # AWE_BEARER_TOKEN_REQUIRED instead of reaching approvers.
    # In the worker the platform reads its settings (AWE included) through the
    # worker's own config class, so they take the REGISTRY_CELERY_WORKERS_
    # prefix; REGISTRY_CORE_AWE_* is silently ignored there and AWE stays off.
    envVars:
      REGISTRY_CELERY_WORKERS_AWE_ENABLED: '{{ .Values.global.aweEnabled }}'
      # In-cluster, like db-seed's AWE wait: the ingress URL (global.aweBaseUrl)
      # is signed by a private CA on far that the worker does not carry.
      REGISTRY_CELERY_WORKERS_AWE_BASE_URL: 'http://{{ tpl .Values.global.aweReleaseName $ }}-awe'
      REGISTRY_CELERY_WORKERS_AWE_HTTP_TIMEOUT_SECONDS: '{{ .Values.global.aweHttpTimeoutSeconds }}'
      REGISTRY_CELERY_WORKERS_AWE_DEFAULT_CALLBACK_URL: '{{ tpl .Values.global.aweDefaultCallbackUrl $ }}'
      REGISTRY_CELERY_WORKERS_AWE_CALLBACK_SECRET_ID: '{{ tpl .Values.global.aweCallbackSecretId $ }}'
      REGISTRY_CELERY_WORKERS_AWE_TOKEN_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
      # keycloakIssuerUrl may be Keycloak's in-cluster address; the token must
      # still carry the public issuer AWE trusts, which this host provides.
      REGISTRY_CELERY_WORKERS_AWE_TOKEN_ISSUER_BASE_URL: '{{ tpl .Values.global.keycloakBaseUrl $ }}'
      REGISTRY_CELERY_WORKERS_AWE_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    envVarsFrom:
      REGISTRY_CELERY_WORKERS_AWE_CLIENT_SECRET:
        secretKeyRef:
          name: '{{ tpl .Values.global.authClientSecret $ }}'
          key: '{{ tpl .Values.global.authClientSecretKey $ }}'
  celeryBeat:
    image:
      repository: registry.gitlab.com/openg2p/registry/farmer-registry/celery
      tag: 0.0.0-develop
  dbSeed:
    image:
      repository: registry.gitlab.com/openg2p/registry/farmer-registry/db-seed
      tag: 0.0.0-develop
    # The subchart defaults these OFF (minimal reference registry). Farmer ships
    # demo records/geo/images, so turn the db-seed loaders on. NB these are
    # `dbSeed.*`, not `global.*` — the db-seed Job reads .Values.dbSeed.load*
    # and there is no global fallback, so setting them under global is inert.
    # Geo is seeded by the master-data chart now (geoSeed.countryPack there),
    # not as a side effect of the registry seed. Leaving this on would load a
    # second, unrelated hierarchy over the one MDS already holds.
    loadGeoData: false
    loadSampleData: true
    loadImages: true
    loadTemplates: true
    # Match the geo dropdowns to the hierarchy Master Data holds. Code lists are
    # not seeded into the registry: from openg2p-registry 1.2 they are read live
    # from Master Data, so the old loadAttributes/attributeDomains switches are gone.
    syncGeoWidgets: true

  # Name of this registry's tile in IAM. The roles/permissions catalog itself is
  # registry-agnostic and comes from the subchart.
  iamRegister:
    applicationDescription: "Farmer Registry"

  # Functional-ID pools, one per register. The subchart defaults to the REFERENCE
  # registry's registers (individual + household), so the farmer register must be
  # declared here. NB Helm merges maps, so `individual` is inherited too and an
  # unused pool is provisioned for it — harmless, and a parent `null` cannot
  # remove a subchart default.
  idgenerator:
    idGenerator:
      appConfig:
        idTypes:
          farmer:
            idLength: 10
          household:
            idLength: 10

  # beneApi is consumed as-is from the openg2p-registry base image.
  # staffUi is a thin branding overlay that replaces only the dashboard
  # background asset.

  # ── Farmer e2e sanity suite (image built here; Set 2 field tests) ───────────
  # The subchart ships the reference (Individual) sanity values; override them
  # for the Farmer register. Behaviour toggles (runE2e/failOnError) keep the
  # subchart defaults.
  sanity:
    enabled: true
    image:
      repository: registry.gitlab.com/openg2p/registry/farmer-registry/sanity-tests
      tag: 0.0.0-develop
    regType: Farmer
    regRecordType: 'spdci-extensions-dci:Farmer'
    # farmer functional_record_id of the injected sanity record (see
    # test/sanity/sanity/fixtures.py).
    searchText: SANITY-FARMER-0001
    # Consented scope + scopes asserted absent — top-level keys of the farmer
    # outgoing DCI template (openg2p_farmer_to_dci.json.j2).
    dataScopes: "farmer_personal_details"
    deniedScopes: "family_details,farm_details,machineries_details"
    # The Farmer register + the UI coordinates the change-request test edits
    # (must match the farmer-extension seed metadata).
    farmerRegisterId: a1a4d25a-1cd4-4356-abac-985a0b3c6bcd
    crTabId: "farmer_farmer_tab"
    crSectionId: "farmer_farmer_personal_identification_section_01"


# ── Analytics: sample data, reporting views ──────────────────────
# Runs after the registry db-seed (hook weight 10) at hook weights 40 -> 45.
#
# There is deliberately no country setting here. Geography comes from whatever
# the environment's Master Data Service holds — see geoSeed.countryPack in the
# openg2p-master-data chart. Declaring a country in two charts is how registry
# records end up pointing at places MDS has never heard of.
analytics:
  # Left empty on purpose: these jobs run in the registry db-seed image and
  # inherit registry.dbSeed.image, whose tag CI rewrites to the built version.
  # Setting a tag here would pin it to a placeholder CI does not update.
  image:
    repository: ""
    tag: ""
  # No dataDir: the sample generator and its distributions are farmer's own and are
  # copied into /seed by the db-seed image. They used to be read from the shared
  # openg2p-data clone at /openg2p-data, which is what let them drift out of step
  # with the enums they write.
  waitImage: jbergknoff/postgresql-client:latest

  bulkSample:
    enabled: true
    # ~250k individuals over ~62.5k households, sized against the DEFAULT geo
    # pack (Kamuntu, 668 villages) so the deepest level averages ~90 households
    # and its percentages are reportable rather than suppressed as unreliable.
    #
    # This is the one number to revisit when changing countryPack, because the
    # denominator that matters is households *per leaf unit*, not the total. The
    # previous 50k was sized for Ethiopia's 1,148 woredas and leaves roughly a
    # dozen households each — enough for counts and rankings, too thin for rates,
    # since one household then moves a percentage by ~8 points.
    farmers: 100000
    # Optional guard: fails the job if MDS holds a different country than this
    # deployment expects. Not a selector — MDS remains the source of truth.
    #
    # This is the root unit's P-code, NOT the pack directory name: "XK" for
    # Kamuntu (pack XKM), "ET" for Ethiopia (pack ETH). The two differ because a
    # P-code is ISO alpha-2 while a pack is named by alpha-3, so setting "XKM"
    # here would abort every run.
    expectedCountry: ""

  reportingViews:
    enabled: true

    # Generate the mechanical views from the schema, after the hand-written
    # ones. Off means this registry reports on exactly the entities somebody
    # remembered to write SQL for — which is how livestock ended up with no
    # view while the register held 132,824 of them.
    generate: true

    # How often the snapshots behind the dashboards are rebuilt.
    #
    # These are MATERIALIZED views: Postgres does not update them when the
    # register changes, so without this they stay frozen at whatever the install
    # produced — new farmers simply never appear, and nothing reports an error.
    # Empty disables the CronJob and leaves the views static.
    #
    # Hourly by default. Raise the frequency for a small register; lower it if
    # the refresh starts overrunning the interval (it runs CONCURRENTLY, so it
    # costs time rather than availability).
    refreshSchedule: "0 * * * *"

    # DEVELOPMENT ONLY — override the reporting scripts from a ConfigMap.
    #
    # The reporting SQL and the platform's generator live in the db-seed image,
    # so testing a change to either normally means building and publishing an
    # image. Point this at a ConfigMap holding the files and the job runs those
    # instead, which turns a fifteen-minute pipeline into a kubectl apply.
    #
    # Empty in every real deployment: an image whose contents can be swapped
    # from outside is not an artifact you can reason about.
    devOverlay:
      configMap: ""
      files:
        - generate_reporting_views.py
        - reporting_views.sql
        - reporting.yaml

    # Which materialized views the refresh covers. Matched by prefix rather than
    # listed, so a view added to reporting_views.sql is picked up without anyone
    # remembering to add it here.
    matchPrefix: fr_rpt_

    # Record every refresh outcome in the reporting_refresh_log table (created
    # by the job) in addition to the JSON line each outcome prints on stdout.
    # The table feeds refresh-health dashboards and alerts; see
    # docs/reporting-refresh-log.md. Rows older than retentionDays are deleted
    # at the end of each run.
    refreshLog:
      enabled: true
      retentionDays: 90

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 2Gi

# ── Maps content for G2P Insights ────────────────────────────────────────────
# The queries and page this registry contributes to the Insights map surface,
# published as a ConfigMap for Insights to mount. See
# templates/maps-content-configmap.yaml for why this is configuration and not
# an image.
#
# Harmless when Insights is not installed: nothing else reads it.
mapsContent:
  enabled: true
  # Defaults to <release>-maps-content. Whatever this resolves to is what goes
  # into the Insights chart as insightMaps.build.content.configMap.
  nameOverride: ""

# ── Public staff portal UI ───────────────────────────────────────────────────
# A second staff UI for an environment's public hostname, rendered by
# templates/staff-ui-public.yaml. The UI takes its origin, cookie domain, IAM URL
# and login provider from env, so the subchart's own staff UI cannot also answer
# on a public hostname.
#
# It runs registry.staffUi.image, which CI sets on every deploy, so a deploy
# refreshes both UIs. Off by default: an environment that publishes the portal
# enables it and supplies the complete env in its release values.
publicStaffUi:
  enabled: false
  replicas: 1
  # Every variable the staff UI reads, as NAME: value. Values may use templates.
  env: {}
  volumes: []
  volumeMounts: []
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 768Mi

# ── Dashboard API ────────────────────────────────────────────────────────────
# farmer-registry-dashboard-api: the read-only service the OAN dashboards BFF
# calls for this registry's chart data, rendered by templates/dashboard-api.yaml.
# Source: https://github.com/Centre-for-Open-Societal-Systems/farmer-registry-dashboard-api
# (built by the Jenkinsfile; see docs/deployment.md §3.5).
#
# It reads fr_rpt_farmer and fr_rpt_land, so it needs analytics.reportingViews.
# The BFF (in the cluster) reaches the ClusterIP Service at
# http://<release>-dashboard-api.<namespace>.
#
# Off by default, so an install that does not ship the image is unchanged. The
# Jenkins deploy turns it on and sets the image.
dashboardApi:
  enabled: false
  image:
    repository: ""
    tag: ""
  replicas: 1
  # gunicorn workers. Each holds its own database pool (below), so a replica
  # uses up to workers x dbPool.maxSize connections on commons-postgresql.
  workers: 2
  # Connections per worker: minSize kept open, maxSize under load. The
  # dashboards cache responses for 15 minutes, so a few are plenty.
  dbPool:
    minSize: 1
    maxSize: 5
  # National number of administrative units per level, for registryCoverage
  # rates, e.g. {regions: 13, zones: 90, woredas: 1138, kebeles: 18000}. A level
  # left out is reported as null.
  geoLevelTotals: {}
  # CORS origins. Browsers are not expected to call the service directly.
  allowedOrigins: []
  # Extra environment variables, as NAME: value. Values may use templates.
  env: {}
  # Optional hostname route for developers and tools, on a PRIVATE Istio gateway
  # only (the service has no authentication), e.g.
  #   host: dashboard-api.far.openg2p.test
  #   gateway: internal
  virtualService:
    enabled: false
    host: ""
    gateway: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
