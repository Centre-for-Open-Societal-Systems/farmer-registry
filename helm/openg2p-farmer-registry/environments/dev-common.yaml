# Gen2 development: registry in far; commons + commons-services in common.
# Apply AFTER the saved live values and BEFORE the CI image overlay. The literal
# service names below match the published RC's release names. Do not use this
# file on staging until its platform has been migrated independently.
#
# Browser hostnames, COOKIE_DOMAIN, IAM_URL, MinIO's public hostname and CA mounts
# are deliberately NOT guessed here. Preserve the live values on upgrade; for a
# first install supply a completed browser-values file (ci/gen2 has an example).
sharedCommons:
  enabled: true
  namespace: common
  baseRelease: commons
  servicesRelease: commons-services
  chartVersion: 2.3.4-rc.245

global:
  postgresqlHost: commons-postgresql.common.svc.cluster.local
  masterDataDB: master_data
  masterDataDBUser: master_data_user
  masterDataDBSecret: master-data-db-user
  masterDataDBUserPasswordKey: master-data-db-user-password
  iamServiceUrl: http://commons-services-iam-staff-portal-api.common.svc.cluster.local
  masterDataApiUrl: http://commons-services-master-data-api.common.svc.cluster.local
  partnerManagementApiUrl: http://commons-services-pm-partner-api.common.svc.cluster.local
  partnerManagementAdminApiUrl: http://commons-services-pm-staff-portal-api.common.svc.cluster.local
  consentManagerUrl: http://commons-services-cm-partner-api.common.svc.cluster.local
  consentManagerStaffUrl: http://commons-services-cm-api.common.svc.cluster.local
  keymanagerInstallationName: commons-services-keymanager.common.svc.cluster.local
  auditManagerUrl: http://commons-services-auditmanager.common.svc.cluster.local:80
  auditEnabled: true
  csrfEnabled: true
  partnerSignatureValidationEnabled: true
  consentEnforcementEnabled: true
  registryCryptoBackend: partner-mgmt
  # Token/initialization traffic stays internal. keycloakBaseUrl remains the
  # browser-facing HTTPS origin; the worker presents that issuer when requesting
  # its service token. Never expose this internal issuer URL as a logout link.
  keycloakIssuerUrl: 'http://commons-keycloak.common.svc.cluster.local/realms/{{ tpl .Values.global.keycloakRealm $ }}'
  keycloakRealm: staff
  authClientId: '{{ .Release.Name }}-staff-portal'
  aweEnabled: true
  aweDB: awe
  aweDBUser: awe_user
  aweDBSecret: awe-db-user
  aweDBUserPasswordKey: awe-db-user-password
  aweReleaseName: commons-services
  aweBaseUrl: http://commons-services-awe.common.svc.cluster.local
  aweDefaultCallbackUrl: 'http://{{ .Release.Name }}-staff-portal-api.{{ .Release.Namespace }}.svc.cluster.local/awe/webhooks/decision'
  # Novu is not bundled in commons-base/services 2.3.4-rc.245.
  notificationEnabled: false

registry:
  keycloak-init:
    keycloak:
      url: http://commons-keycloak.common.svc.cluster.local
  staffApi:
    envVars:
      # Must read the SAME Redis instance and DB index IAM writes its sessions to.
      REGISTRY_STAFF_PORTAL_API_AUTH_REDIS_URL: redis://commons-redis-master.common.svc.cluster.local:6379/0
  staffUi:
    envVars:
      KEYCLOAK_LOGOUT_URL: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}/protocol/openid-connect/logout'
      MASTERDATA_BACKEND_API_URL: http://commons-services-master-data-api.common.svc.cluster.local
  celeryWorker:
    envVars:
      REGISTRY_CELERY_WORKERS_AWE_BASE_URL: http://commons-services-awe.common.svc.cluster.local
  dbSeed:
    loadGeoData: false
    loadSampleData: false
    loadImages: false
    loadTemplates: true
    syncGeoWidgets: true

# If the existing public UI is enabled, change only its internal dependency and
# logout wiring. Preserve its own APP_URL, IAM_URL, cookie domain and CA mounts.
publicStaffUi:
  env:
    MASTERDATA_BACKEND_API_URL: http://commons-services-master-data-api.common.svc.cluster.local
    KEYCLOAK_LOGOUT_URL: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}/protocol/openid-connect/logout'
    APPLICATION_MNEMONIC: '{{ tpl .Values.global.authClientId $ }}'
    LOGIN_PROVIDER_ID: '1'
    CSP_SRC_IMG: 'self blob: data: https://{{ tpl .Values.global.minioHost $ }}'

analytics:
  bulkSample:
    enabled: false
  reportingViews:
    enabled: true
mapsContent:
  enabled: false
