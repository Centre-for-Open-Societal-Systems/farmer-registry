apiVersion: v2
name: openg2p-farmer-registry
description: OAN Farmer Registry for OpenAgriNet (OAN), developed in OAN repositories;
  reuses pinned OpenG2P platform templates. Component images have independent versions.
type: application
version: 0.0.0
appVersion: 1.2.2-rc.625
keywords:
- oan
- openagrinet
- openg2p
- registry
- farmer-registry
home: https://github.com/Centre-for-Open-Societal-Systems/farmer-registry
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
sources:
- https://github.com/Centre-for-Open-Societal-Systems/farmer-registry
- https://github.com/Centre-for-Open-Societal-Systems/oan-helm
- https://github.com/Centre-for-Open-Societal-Systems/farmer-registry-dashboard-api
- https://github.com/Centre-for-Open-Societal-Systems/oan_farmerregistry_dashboard
- https://github.com/OpenG2P/farmer-registry
- https://github.com/OpenG2P/registry-connector
maintainers:
- name: OpenAgriNet (OAN)
  url: https://github.com/Centre-for-Open-Societal-Systems/oan-helm
dependencies:
- name: openg2p-registry
  alias: registry
  version: 1.2.2-rc.625
  repository: https://openg2p.github.io/openg2p-helm
annotations:
  catalog.cattle.io/display-name: OAN Farmer Registry
  catalog.cattle.io/certified: partner
  catalog.cattle.io/kube-version: '>=1.23.0-0'
  openg2p.org/add-to-rancher: ''
  oan.org/owner: OpenAgriNet (OAN)
  oan.org/application-source: https://github.com/Centre-for-Open-Societal-Systems/farmer-registry
  oan.org/chart-source: https://github.com/Centre-for-Open-Societal-Systems/farmer-registry/tree/develop/helm/openg2p-farmer-registry
  org.opencontainers.image.source: https://github.com/Centre-for-Open-Societal-Systems/farmer-registry
  oan.org/promotion-ready: 'true'
