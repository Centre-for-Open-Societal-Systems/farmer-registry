apiVersion: v2
name: openg2p-farmer-registry
description: |
  OpenG2P Farmer Registry — a thin, branded package over the shared
  openg2p-registry chart published by the registry platform.

  The openg2p-registry dependency provides the core registry workloads,
  identity wiring and seed jobs. This chart supplies farmer values, images
  and metadata, and owns the dashboard API and farmer reporting layer:

    dashboard-api.yaml                 read-only chart-data API
    analytics-jobs.yaml                bulk-sample + reporting-views Jobs
    reporting-views-refresh.yaml       materialized-view refresh CronJob
    maps-content-configmap.yaml        maps content for G2P Insights
    _maps-content.tpl                  its name helper

  Hook weights order these above the sanity suite (25), so rebuilding the views
  cannot change what the sanity tests asserted against.
type: application

# Version handling:
#   This `version` is a STATIC placeholder — it is NOT the published version.
#   The central CI pipeline (build-publish.yml -> openg2p-packaging @v1) derives
#   the real version from git (one version per commit) and overrides it at
#   publish time, in lockstep with the farmer images this chart references.
#   Bumping it here only affects a local `helm package`/`helm install .`.
version: 0.0.0-develop
appVersion: "develop"

keywords:
  - openg2p
  - registry
  - farmer-registry
home: https://openg2p.org
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
sources:
  - https://github.com/OpenG2P/farmer-registry
maintainers:
  - name: OpenG2P
    email: info@openg2p.org

# The Farmer Registry is the openg2p-registry chart plus a values overlay. The
# openg2p-registry version is HARDCODED (not CI-rewritten): the farmer images
# extend that same base image tag, so the two are pinned together and only moved
# deliberately. Aliased to `registry` so the overlay nests under a hyphen-free
# key (.Values.registry.*).
#
# Since the platform moved to GitLab, openg2p-registry is pulled from the shared
# `openg2p/charts` Helm registry (project 84460547, channel `stable`) rather than
# the old openg2p-helm GitHub Pages index, which is frozen at the pre-move
# versions. The project is public, so no credentials are needed to resolve it.
dependencies:
  - name: openg2p-registry
    alias: registry
    version: 1.2.2-rc.544
    repository: https://openg2p.github.io/openg2p-helm

# Rancher catalog branding
annotations:
  catalog.cattle.io/display-name: "OpenG2P Farmer Registry"
  catalog.cattle.io/certified: partner
  catalog.cattle.io/kube-version: ">=1.23.0-0"
  openg2p.org/add-to-rancher: ""
