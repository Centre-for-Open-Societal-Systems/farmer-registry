{{/*
Keep the reporting views current.

WHY THIS BELONGS HERE
---------------------
`fr_rpt_farmer` and friends are MATERIALIZED views: they hold a snapshot taken
when this chart created them, and Postgres never updates a materialized view
when its base tables change. Nothing else in this chart touched them again, so a
registry installed and then used normally showed dashboards frozen at install
time — every farmer registered afterwards invisible, with no error anywhere to
say so.

The refresh did exist, but inside G2P Insights' maps build. That put the
freshness of THIS registry's reporting data behind an analytics release: a
deployment without Insights never refreshed at all, and one with it refreshed
only as a side effect of building maps. Creation and refresh belong to the same
owner — the reporting views are ours, and so is keeping them true.

WHAT IT DOES
------------
Refreshes in DEPENDENCY ORDER, resolved from the catalog rather than listed:
fr_rpt_crop and fr_rpt_farmer both read fr_rpt_land, so refreshing them first
would rebuild them from the previous snapshot and quietly produce a half-updated
set. A hand-maintained list would also have to be kept in step with
reporting_views.sql by whoever next edits it, which is the kind of coupling that
holds for exactly as long as the two files have the same author.

Every outcome (refreshed, refreshed_blocking, failed, skipped) is written as a
JSON line on stdout and as a row in reporting_refresh_log, so refresh health can
be monitored. See docs/reporting-refresh-log.md.
*/}}
{{- if and .Values.analytics.reportingViews.enabled .Values.analytics.reportingViews.refreshSchedule }}
{{- $seedRepo := .Values.analytics.image.repository | default .Values.registry.dbSeed.image.repository }}
{{- $seedTag := .Values.analytics.image.tag | default .Values.registry.dbSeed.image.tag }}
{{- $pg := tpl .Values.global.postgresqlHost $ }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-fr-reporting-views-refresh
  labels:
    app.kubernetes.io/name: fr-reporting-views-refresh
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  schedule: {{ .Values.analytics.reportingViews.refreshSchedule | quote }}
  # A refresh that overruns its slot must not have a second one started on top
  # of it: CONCURRENTLY already holds the work open for minutes on a large
  # register, and two of them serialise into a queue that never drains.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: fr-reporting-views-refresh
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          containers:
            - name: refresh
              image: {{ $seedRepo }}:{{ $seedTag }}
              # The script lives in files/ so it can be run and tested outside
              # Kubernetes; see docs/reporting-refresh-log.md.
              command:
                - sh
                - -c
                - |
{{ .Files.Get "files/reporting-views-refresh.sh" | indent 18 }}
              env:
                - name: MATCH_PREFIX
                  value: {{ .Values.analytics.reportingViews.matchPrefix | quote }}
                - name: REFRESH_LOG_ENABLED
                  value: {{ .Values.analytics.reportingViews.refreshLog.enabled | toString | quote }}
                - name: REFRESH_LOG_RETENTION_DAYS
                  value: {{ .Values.analytics.reportingViews.refreshLog.retentionDays | toString | quote }}
                - name: PGHOST
                  value: {{ $pg | quote }}
                - name: PGPORT
                  value: {{ .Values.global.registryDBPort | default 5432 | quote }}
                - name: PGDATABASE
                  value: {{ tpl .Values.global.registryDB $ | quote }}
                - name: PGUSER
                  value: {{ tpl .Values.global.registryDBUser $ | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ tpl .Values.global.registryDBSecret $ | quote }}
                      key: {{ tpl .Values.global.registryDBUserPasswordKey $ | quote }}
              resources: {{- toYaml .Values.analytics.resources | nindent 16 }}
{{- end }}
