{{- if and .Values.sharedCommons.enabled .Values.global.aweEnabled }}
{{- if eq .Values.sharedCommons.namespace .Release.Namespace }}
{{- fail "sharedCommons.namespace must differ from the registry namespace; otherwise disable sharedCommons" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-awe" (tpl .Values.global.aweReleaseName $) }}
  labels:
    app.kubernetes.io/name: shared-awe-alias
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ExternalName
  externalName: {{ printf "%s-awe.%s.svc.cluster.local" .Values.sharedCommons.servicesRelease .Values.sharedCommons.namespace }}
  ports:
    - name: http
      port: 80
{{- end }}
