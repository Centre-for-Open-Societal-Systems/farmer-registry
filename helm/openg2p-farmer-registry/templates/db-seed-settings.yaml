{{/*
Settings of the sample-data loader (docker/db-seed/load_sample_data.py) that the platform's
db-seed Job does not pass: Master Data's API and token URL and client id (the same values
fr.mdsApiEnv gives the analytics Jobs) and the public staff IAM URL the loader signs in through.
ci/deploy/oan_compat.py adds this ConfigMap to the db-seed container with envFrom. The client
secret is not here: the Job already carries it as STAFF_CLIENT_SECRET (the same Secret).
Rendered only when sample data is on; the render fails if one of the settings would be empty.
*/}}
{{- $seed := .Values.registry.dbSeed | default dict }}
{{- if $seed.loadSampleData }}
{{- $staffUi := .Values.registry.staffUi | default dict }}
{{- $settings := dict
  "MDS_API_URL" (tpl (.Values.global.masterDataApiUrl | default "") .)
  "MDS_TOKEN_URL" (tpl (.Values.global.masterDataTokenUrl | default "") .)
  "MDS_CLIENT_ID" (tpl (.Values.global.authClientId | default "") .)
  "STAFF_IAM_URL" (tpl ($staffUi.iamPublicUrl | default "") .) }}
{{- range $name, $value := $settings }}
{{- if not $value }}
{{- fail (printf "registry.dbSeed.loadSampleData is true but the sample loader's %s would be empty" $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-db-seed-settings
  labels:
    app.kubernetes.io/name: db-seed
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
{{- range $name, $value := $settings }}
  {{ $name }}: {{ $value | quote }}
{{- end }}
{{- end }}
