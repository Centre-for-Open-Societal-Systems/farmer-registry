{{- if .Values.analytics.reportingViews.enabled }}
{{- $settings := .Values.analytics.reportingViews }}
{{- $imageRepo := .Values.analytics.image.repository | default .Values.registry.dbSeed.image.repository }}
{{- $imageTag := .Values.analytics.image.tag | default .Values.registry.dbSeed.image.tag }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-fr-reporting-views
  labels:
    app.kubernetes.io/name: fr-reporting-views
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "45"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ add $settings.waitForSchemaSeconds 300 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fr-reporting-views
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      {{- with .Values.analytics.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: reporting-views
          image: {{ printf "%s:%s" $imageRepo $imageTag | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              attempts=0
              until [ "$(psql -qtAX -v ON_ERROR_STOP=1 -c "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='g2p_register_farmers' AND column_name='income_sources')")" = t ]; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge {{ div $settings.waitForSchemaSeconds 5 }} ]; then
                  echo 'Reporting blocked: native/OAN schema migration is incomplete' >&2
                  exit 1
                fi
                sleep 5
              done
              python3 /seed/oan-reporting/sync_geo_levels.py
              psql -X -v ON_ERROR_STOP=1 -f /seed/reporting_views.sql
          env:
            - name: PGHOST
              value: {{ tpl .Values.global.postgresqlHost $ | quote }}
            - name: PGPORT
              value: {{ .Values.global.registryDBPort | quote }}
            - name: PGDATABASE
              value: {{ tpl .Values.global.registryDB $ | quote }}
            - name: PGUSER
              value: {{ tpl .Values.global.registryDBUser $ | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.global.registryDBSecret $ | quote }}
                  key: {{ tpl .Values.global.registryDBUserPasswordKey $ | quote }}
            - name: MDS_API_URL
              value: {{ tpl (tpl $settings.masterData.apiUrl $) $ | quote }}
            - name: MDS_TOKEN_URL
              value: {{ tpl (tpl $settings.masterData.tokenUrl $) $ | quote }}
            - name: MDS_CLIENT_ID
              value: {{ tpl (tpl $settings.masterData.clientId $) $ | quote }}
            - name: MDS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ tpl (tpl $settings.masterData.clientSecret.name $) $ | quote }}
                  key: {{ tpl (tpl $settings.masterData.clientSecret.key $) $ | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.analytics.resources | nindent 12 }}
{{- end }}
