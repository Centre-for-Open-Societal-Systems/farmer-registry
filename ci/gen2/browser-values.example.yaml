# EXAMPLE ONLY. Replace every example.org hostname with the real dev ingress.
# Secrets/passwords do not belong in this file. Keep the existing full CA bundle
# mounts from the live release, or provision them through the platform owner.
# Cookie scope must be shared by the IAM and farmer browser origins; use distinct
# Keycloak clients/application mnemonics for far/crop/live, NOT distinct cookies.
global:
  registryHostname: farmer.dev.example.org
  keycloakBaseUrl: https://keycloak.dev.example.org
  minioHost: minio.dev.example.org
  minioSecure: true
registry:
  staffUi:
    iamPublicUrl: https://staff-iam.dev.example.org
    envVars:
      IAM_URL: https://staff-iam.dev.example.org
      COOKIE_DOMAIN: .dev.example.org
      LOGIN_PROVIDER_ID: '1'
