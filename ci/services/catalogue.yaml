cossAddons:
  components:
  - name: registry-connector
    repository: https://github.com/OpenG2P/registry-connector.git
    # The release runs this upstream commit, the last one with the api/ chart and Dockerfile layout. Upstream
    # moved packaging to docker/ and deployments/charts/registry-connector (chart renamed, DB names derived
    # from the release name); moving to it is its own change, made against the live release values.
    sourceCommit: bc565efd47c129ff0ce25809bd946afc2b5e70f5
    dockerfile: api/Dockerfile
    context: api
    chart: api/deploy/charts/openg2p-connector
    release: farmer-registry-connector
    namespace: farmer
    kind: connector
    allowInstall: true
    imageValues: api.image
    images:
      api:
        dockerfile: api/Dockerfile
        context: api
        overlay: integrations/registry-connector
        imageValues:
        - api.image
        - worker.image
        - beat.image
        - consumer.image
      ui:
        dockerfile: ui/Dockerfile
        context: ui
        overlay: docker/registry-connector-ui
        overlayContext: repository
        imageValues:
        - ui.image
  - name: farmer-registry-dashboard
    imageRepository: openg2p/farmer-registry/dashboard-ui
    repository: https://github.com/Centre-for-Open-Societal-Systems/oan_farmerregistry_dashboard.git
    dockerfile: Dockerfile
    chart: helm/farmer-registry-dashboard
    chartSource: registry
    allowInstall: true
    dependsOn: farmer-registry-dashboard-api
    release: farmer-registry-dashboard
    namespace: farmer
    imageValues: image
  - name: farmer-registry-dashboard-api
    repository: https://github.com/Centre-for-Open-Societal-Systems/farmer-registry-dashboard-api.git
    dockerfile: Dockerfile
    chart: helm/openg2p-farmer-registry
    release: farmer-registry
    namespace: farmer
    kind: registry-dashboard-api
    imageRepository: openg2p/farmer-registry/dashboard-api
    imageValues: dashboardApi.image
