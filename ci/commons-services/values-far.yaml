# Values overlay for the `commons-services` release in the `far` namespace.
#
# Applied by upgrade.sh on top of the release's live values (`helm get
# values`), together with the chart version pinned in that script. The live values hold the
# environment's hostnames and wiring and stay untouched; this file holds only
# what the farmer registry needs from the shared platform services.
#
# G2R-172: staff-ui 1.2.1 calls master-data at /geo/get_all_geo_levels and
# /geo/get_geo_level_values, but the master-data build that was installed by
# hand (an early pull of the floating 0.0.0-develop.26 tag) only serves the old
# /geo/get_all_g2p_geo_levels names, so the intake form's Location section got
# 404s. The chart bump to 2.3.0-rc.217 moves master-data to 1.1.0-rc.55, which
# serves the current names. An image-only swap is not possible: chart 2.2.0
# renders GEN2_MASTER_DATA_API_* env names and the new build reads
# MASTER_DATA_API_*, so it would start with no database configuration.
masterData:
  masterDataAPI:
    image:
      # The chart default still points at registry.gitlab.com/openg2p/
      # master-data-service/..., which no longer allows anonymous pulls. Same
      # image, current path. The tag stays at the chart default (1.1.0-rc.55).
      repository: registry.gitlab.com/openg2p/platform-services/master-data-service/master-data-api
    # Auth wiring master-data has never had. Both were applied to staging by
    # hand on 2026-09-23 (a `kubectl set env`, because the release's chart is a
    # local patch that cannot be rebuilt -- see README "Before you run this");
    # they live here so the eventual chart upgrade carries them instead of
    # silently reverting the Deployment to the broken state.
    #
    # The key is a MAP named envVars (not env / extraEnv / a list), and its
    # values are tpl-evaluated by the subchart. Verified against
    # openg2p-commons-services 2.2.0-patched1; re-check the shape when the pin
    # moves, because this service has already changed env prefixes once
    # (GEN2_MASTER_DATA_API_ -> MASTER_DATA_API_ -> COMMON_ for the iam_core
    # settings, whose env_prefix is `common_`).
    envVars:
      # master-data mounts iam_core's session middleware, whose
      # RedisRefreshTokenStore falls back to redis://localhost:6379/0 when
      # unset -- there is no Redis in that pod, so every authenticated request
      # raised a connection error and the API answered 500. The intake form's
      # Location section is the visible casualty: its geo-hierarchy widget
      # calls /geo/get_all_geo_levels on every render.
      #
      # This mirrors IAM's own IAM_STAFF_AUTH_REDIS_URL template, and the DB
      # index is not a free choice: master-data READS the refresh_token:* keys
      # that IAM WRITES, so a different instance or index resolves a valid
      # session to None and turns the 500 into a 401.
      #
      # Never present in any of the nine revisions of this release -- a gap
      # from master-data acquiring the middleware without the values following,
      # not a regression.
      COMMON_AUTH_REDIS_URL: 'redis://{{ tpl .Values.global.redisInstallationName $ }}-master:6379/0'
  # global.authProviderApiUrl ships as http://iam-staff-portal-api, which
  # resolves nowhere; the chart's own global.iamServiceUrl one line away
  # already carries the correct Service name. Only the master-data Deployment
  # consumes it in the whole rendered release, so overriding the global is
  # safe and fixes the defect rather than patching around it.
  #
  # Kept under masterData for locality with the change above, but it is a
  # global -- see the `global:` block at the end of this file.
  geoSeed:
    image:
      # Same path move for the seed the post-upgrade hook runs.
      repository: registry.gitlab.com/openg2p/platform-services/master-data-service/master-data-db-seed
    # countryPack is ETH in this chart version's defaults; not repeated here.
    objectStore:
      # Boundary geometry (the map layer) is uploaded to MinIO when an endpoint
      # is set, and the seed aborts if that upload fails or the referenced
      # secret is missing. The administrative hierarchy the Location widget
      # needs loads without it. Left off until the MinIO wiring for master-data
      # in this namespace is confirmed; then set the endpoint and re-run.
      endpoint: ""
  # The master-data admin UI would be a new deployment in the namespace;
  # nothing in the farmer registry uses it.
  masterDataUi:
    enabled: false

# Image paths for the other services this chart version moves. OpenG2P moved its
# GitLab projects under openg2p/platform-services/ around 2026-08-24, and the old
# paths answer 403 to anonymous pulls, so a rollout onto a chart default would sit
# in ImagePullBackOff while the old pod keeps serving -- a stuck upgrade that still
# reports success, because helm does not wait on these deployments. Same images,
# same tags, current path; each tag below was checked against the registry.
#
# partner-management is listed even though its Deployments do not restart -- their
# rendered pod template matches the one in the release manifest. The kc-sa-role
# hook Job is the reason: helm creates it fresh on every upgrade and it pulls the
# staff-portal-api image, so on the old path it wedges in ImagePullBackOff and helm
# waits on the hook until the upgrade times out. Seen on the 2026-09-16 run.
#
# Not listed, deliberately: audit-manager, whose tag here matches what is already
# running, so the upgrade neither restarts nor pulls it.
openg2p-awe:
  awe:
    image:
      repository: registry.gitlab.com/openg2p/platform-services/awe/openg2p-awe
  ui:
    image:
      repository: registry.gitlab.com/openg2p/platform-services/awe/openg2p-awe-ui
openg2p-iam-service:
  iamStaffPortalApi:
    image:
      repository: registry.gitlab.com/openg2p/platform-services/iam/iam-staff-portal-api
  # Two deployments this chart version would add to the namespace. The agent
  # portal reads its config from a secret named `agent-portal`, which this chart
  # does not create and `far` does not have, so the pod would sit in
  # CreateContainerConfigError; the IAM staff UI is the IAM admin console, which
  # nothing here routes to. The image paths stay current so that enabling either
  # one later does not land back on a path that refuses anonymous pulls.
  iamAgentPortalApi:
    enabled: false
    image:
      repository: registry.gitlab.com/openg2p/platform-services/iam/iam-agent-portal-api
  iamStaffUi:
    enabled: false
    image:
      repository: registry.gitlab.com/openg2p/platform-services/iam/iam-staff-ui
openg2p-consent-manager:
  consentManagerApi:
    image:
      # This subchart keeps the host in a separate `registry` key, which stays.
      repository: openg2p/platform-services/consent-manager/consent-manager-api
  ui:
    image:
      repository: openg2p/platform-services/consent-manager/consent-manager-ui
  sanity:
    image:
      # sanity's template renders repository:tag directly, so the host goes here.
      repository: registry.gitlab.com/openg2p/platform-services/consent-manager/consent-manager-sanity
partner-management:
  staffPortalApi:
    image:
      # Also the image of the kc-sa-role hook Job, which pulls on every upgrade.
      # Separate `registry` key here, as in consent-manager: only the path moves.
      repository: openg2p/platform-services/partner-management/staff-portal-api
  partnerApi:
    image:
      repository: openg2p/platform-services/partner-management/partner-api
  staffPortalUi:
    image:
      repository: openg2p/platform-services/partner-management/staff-portal-ui

# Components this chart version would add to the namespace that the farmer
# registry does not use. Held off so the upgrade stays within what G2R-172
# requires; enable deliberately when there is a consumer.
superset:
  enabled: false
openg2p-inji-certify:
  enabled: false

# Chart-level defect, fixed here because only one Deployment consumes it.
# global.authProviderApiUrl ships as `http://iam-staff-portal-api`, a Service
# name that exists in no namespace, while global.iamServiceUrl -- declared a
# few lines away in the same block -- carries the correct
# `http://commons-services-iam-staff-portal-api`. Only
# Deployment/commons-services-master-data-api reads authProviderApiUrl in the
# whole rendered release, so the blast radius of correcting it is exactly one
# workload. Applied to staging by hand alongside COMMON_AUTH_REDIS_URL above.
global:
  authProviderApiUrl: http://commons-services-iam-staff-portal-api
