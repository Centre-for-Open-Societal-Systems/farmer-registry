# Values overlay for the `commons-services` release in the `far` namespace.
#
# Applied by upgrade.sh on top of the release's live values (`helm get
# values`), together with the chart version pinned in that script. The live values hold the
# environment's hostnames and wiring and stay untouched; this file holds only
# what the farmer registry needs from the shared platform services.
#
# IMAGES. Every image is set here explicitly, repository and tag, for two
# reasons:
#   * OpenG2P no longer publishes to registry.gitlab.com, and the old paths
#     refuse anonymous pulls. Live values from earlier revisions still name
#     those paths, and upgrade.sh layers this file on top of them, so a key left
#     out here would quietly keep a GitLab path. upgrade.sh fails the run if any
#     rendered image still points at registry.gitlab.com.
#   * The chart (openg2p-commons-services 2.3.3) pins each service's release.
#     The tags below are those releases, or the newer patch release of the same
#     line where one exists (Master Data 1.1.3, IAM 1.4.2, Consent Manager
#     1.0.3): dependency and connection-pool fixes only, and the set verified end
#     to end with registry-platform 1.2 on the local stack.
masterData:
  masterDataAPI:
    image:
      repository: openg2p/master-data-api
      tag: "1.1.3"
  geoSeed:
    image:
      repository: openg2p/master-data-db-seed
      tag: "1.1.3"
    # Explicit rather than inherited: the subchart's own default is XKM, the
    # fictitious Kamuntu pack, and none of it may come back into this namespace.
    countryPack: ETH
    # The location hierarchy is NOT the pack's. far carries the same Ethiopia
    # hierarchy as the crop and live registries (ids <level>-<P-code>, down to
    # kebele), loaded by ci/commons-services/seed-locations.sh from
    # docker/local-dev/geo-seed/ethiopia_geo_seed.sql.gz. The pack's geo uses
    # bare P-codes as ids under levels named region/zone/woreda, and those names
    # are UNIQUE in g2p_geo_levels: left on, this post-upgrade hook would fail on
    # its first INSERT and take the helm upgrade down with it.
    #
    # Code lists stay on: the staff portal's dropdowns read them from here.
    # Samples are off: the pack's sample people carry pack ids.
    load:
      geo: false
      codelists: true
      samples: false
    objectStore:
      # Boundary geometry (the map layer) is uploaded to MinIO when an endpoint
      # is set, and the seed aborts if that upload fails or the referenced
      # secret is missing. The administrative hierarchy the Location widget
      # needs loads without it. Left off until the MinIO wiring for master-data
      # in this namespace is confirmed; then set the endpoint and re-run.
      endpoint: ""
  # The master-data admin UI would be a new deployment in the namespace;
  # nothing in the farmer registry uses it.
  masterDataUi:
    enabled: false
    image:
      repository: openg2p/master-data-ui
      tag: "1.1.3"

openg2p-awe:
  awe:
    image:
      repository: openg2p/openg2p-awe
      tag: "1.2.2"
  ui:
    image:
      repository: openg2p/openg2p-awe-ui
      tag: "1.2.2"

openg2p-iam-service:
  iamStaffPortalApi:
    image:
      repository: openg2p/iam-staff-portal-api
      tag: "1.4.2"
  # Two deployments this chart would add to the namespace. The agent portal
  # reads its config from a secret named `agent-portal`, which this chart does
  # not create and `far` does not have, so the pod would sit in
  # CreateContainerConfigError; the IAM staff UI is the IAM admin console, which
  # nothing here routes to. Their images are set anyway, so enabling either one
  # later does not land on a GitLab path carried over in the live values.
  iamAgentPortalApi:
    enabled: false
    image:
      repository: openg2p/iam-agent-portal-api
      tag: "1.4.2"
  iamStaffUi:
    enabled: false
    image:
      repository: openg2p/iam-staff-ui
      tag: "1.4.2"

openg2p-consent-manager:
  consentManagerApi:
    image:
      repository: openg2p/consent-manager-api
      tag: "1.0.3"
  ui:
    image:
      repository: openg2p/consent-manager-ui
      tag: "1.0.3"
  sanity:
    image:
      repository: openg2p/consent-manager-sanity
      tag: "1.0.3"

# Registry platform 1.2 resolves every ingest's sender against Partner
# Management, so the farmer partner-api cannot accept ODK submissions while it
# is down. The staff-portal-api image is also the image of the kc-sa-role hook
# Job, which gives the commons-services-staff-portal service account the
# partner_manager role the registry and register-partners.sh authenticate with.
partner-management:
  staffPortalApi:
    image:
      repository: openg2p/partner-management-staff-portal-api
      tag: "1.0.2"
    # Partner Management rejects a token whose `iss` is not in this list, and
    # the farmer partner-api's lookups would all come back unauthorized. The
    # chart renders global.keycloakIssuerUrl, which carries an explicit :80;
    # Keycloak takes the issuer from the request's Host header, and HTTP clients
    # drop the default port from it, so the registry's tokens say
    # http://commons-keycloak.commons.svc.cluster.local/realms/staff. Both forms
    # are accepted. The two lists are paired by position, hence the repeated
    # JWKS URL.
    envVars:
      PARTNER_MANAGER_AUTH_DEFAULT_ISSUERS: '["http://commons-keycloak.commons.svc.cluster.local/realms/staff","http://commons-keycloak.commons.svc.cluster.local:80/realms/staff"]'
      PARTNER_MANAGER_AUTH_DEFAULT_JWKS_URLS: '["http://commons-keycloak.commons.svc.cluster.local/realms/staff/protocol/openid-connect/certs","http://commons-keycloak.commons.svc.cluster.local/realms/staff/protocol/openid-connect/certs"]'
  partnerApi:
    image:
      repository: openg2p/partner-management-partner-api
      tag: "1.0.2"
  staffPortalUi:
    image:
      repository: openg2p/partner-management-staff-portal-ui
      tag: "1.0.2"

openg2p-audit-manager:
  auditManager:
    image:
      repository: openg2p/openg2p-audit-manager
      tag: "1.2.0"

# The staff portal builds IAM_URL from its own global.iamUrl, which defaults to
# an external https://staff-iam.<namespace>.<domain> host, while the parent
# chart passes it iamServiceUrl, which it never reads. The portal calls IAM from
# its server, so it keeps the in-cluster Service it uses today.
openg2p-staff-portal-ui:
  global:
    iamUrl: http://commons-services-iam-staff-portal-api

# Subchart defaults that build hostnames as <name>.<namespace>.openg2p.org.
# This environment's domain is openg2p.test (global.baseDomain in the live
# values): the staff portal's cookie domain and the application links IAM hands
# out follow it.
global:
  domain: openg2p.test
  aweApplicationUrl: 'https://awe.{{ .Release.Namespace }}.openg2p.test'
  masterDataApplicationUrl: 'https://master-data.{{ .Release.Namespace }}.openg2p.test'
  iamStaffUiApplicationUrl: 'https://iam-staff-ui.{{ .Release.Namespace }}.openg2p.test'

# Components this chart would add to the namespace that the farmer registry
# does not use. Enable deliberately when there is a consumer.
superset:
  enabled: false
openg2p-inji-certify:
  enabled: false
