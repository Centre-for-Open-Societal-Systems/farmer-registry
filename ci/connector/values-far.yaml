# Values for the `farmer-connector` release in the `far` namespace.
#
# The connector polls ODK Central and posts each submission to the farmer
# registry's Partner API. Same shape as crop's and live's releases, pointed at
# far's own services; the chart is vendored at
# openg2p-connector-service/deploy/charts/openg2p-connector.
#
# Images come from this repository's pipeline, so the connector moves with the
# registry rather than with another registry's builds. CI sets the tags.
fullnameOverride: farmer-connector

global:
  # Internal host only. There is no public route: the connector UI manages
  # pipelines and holds ODK credentials, so it stays on the WireGuard side
  # unless someone asks for it, as live's does.
  hostname: connector-farmer-registry.far.openg2p.test
  postgresqlHost: commons-postgresql
  postgresqlPort: 5432
  redisHost: farmer-registry-redis-master
  redisPort: 6379
  partnerApiService: farmer-registry-partner-api
  connectorDB: farmer_connector
  connectorDBUser: farmer_connector_user
  connectorDBSecret: farmer-connector
  connectorDBUserPasswordKey: farmer-connector-db-user

# far pulls from ECR with this secret, refreshed every 8h by the
# ecr-creds-refresh CronJob.
imagePullSecrets:
  - name: far-ecr

commonEnv:
  CONNECTOR_DB_DRIVER: postgresql+asyncpg
  CONNECTOR_LOG_LEVEL: INFO
  CONNECTOR_STORE_RUN_PAYLOADS: "true"
  CONNECTOR_STRICT_INCREMENTAL: "true"
  CONNECTOR_FULL_SCAN_ON_INCREMENTAL_UNSUPPORTED: "false"
  CONNECTOR_METRICS_ENABLED: "true"
  CONNECTOR_CORS_ORIGINS: https://connector-farmer-registry.far.openg2p.test
  # ODK Central lives in this namespace, so the connector reaches it by service
  # name rather than through istio and the self-signed .test certificate.
  CONNECTOR_ODK_CENTRAL_BASE_URL: http://commons-services-odk-central-frontend

# Creates the farmer_connector database and its user. The chart already
# templates the database, user and secret from the global.* values above, and
# already reads the shared postgres' superuser password from the
# commons-postgresql secret, so only the toggle belongs here.
postgres-init:
  enabled: true

istio:
  enabled: true
  gateway:
    create: false
    name: internal
  virtualservice:
    enabled: true
    gateway: internal

# Tags are replaced per build by ci/connector/deploy.sh.
api:
  image:
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/connector-service
    pullPolicy: Always
worker:
  image:
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/connector-service
    pullPolicy: Always
beat:
  image:
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/connector-service
    pullPolicy: Always
ui:
  image:
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/openg2p/farmer-registry/connector-ui
    pullPolicy: Always
